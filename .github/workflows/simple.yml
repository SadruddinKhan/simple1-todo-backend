name: Simple Concept Workflow

on:
    workflow_dispatch:

env:
    APP_NAME: "Todo backend"
    ENVIRONMENT: "Production"

jobs:
    learn:
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: echo "Hello World from $APP_NAME"

            - name: step2
              run: echo "Hello World 2 from $APP_NAME in $ENVIRONMENT"

            - name: step3
              run: |
                echo "Name of the dockerhub user name ${{ vars.DOCKERHUB_USERNAME}}"
                echo "Name of the ec2 username ${{ vars.EC2_USERNAME}}"
